# Nginx config for the Mini Exchange frontend.
#
# Serves the static Vite build and proxies backend routes to the in-memory
# API service so the browser can talk to a single origin (http://localhost:3000).

upstream api_backend {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Shared proxy headers for all backend routes.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Backend API routes.
    location /api/ {
        proxy_pass http://api_backend;
    }

    # Health probes.
    location /health/ {
        proxy_pass http://api_backend;
    }

    # OpenAPI schema.
    location = /openapi.json {
        proxy_pass http://api_backend;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
