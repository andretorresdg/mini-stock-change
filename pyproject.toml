[build-system]
requires = ["setuptools>=74"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-exchange"
version = "0.1.0"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = [
    "--cov=mini_exchange",
    "--cov-branch",
    "--cov-fail-under=100",
    "--cov-report=term-missing",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["mini_exchange"]

[tool.coverage.report]
fail_under = 100

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "N",
    "S",
    "ANN",
    "RUF",
]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["mini_exchange"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
