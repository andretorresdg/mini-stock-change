# In-memory MVP: run exactly one API process.
# Scaling to multiple replicas splits the in-memory exchange state.
# Add PostgreSQL (or another durable store) before scaling horizontally.

services:
  api:
    build:
      context: .
      dockerfile: deploy/backend.Containerfile
    ports:
      - "8000:8000"
    restart: on-failure

  # React frontend served by Nginx. It proxies /api, /health, and
  # /openapi.json to the api service, so the browser uses one origin.
  web:
    build:
      context: ./web
      dockerfile: Containerfile
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api
    restart: on-failure
